[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ueba-score-calibration"
version = "0.2.0"
description = "Hierarchical Contextual Score Calibration for UEBA & Anomaly Detectors (CERT r4.2 / r5.2 / r6.2)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
keywords = ["ueba", "anomaly-detection", "score-calibration", "cybersecurity", "hierarchical-bayes", "cert-dataset", "machine-learning"]
authors = [
    { name = "NikolaCloud", email = "dev@portfolio.local" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.16",
    "pyarrow>=18",
    "requests>=2.32,<3",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
m5 = [
    "numba>=0.61",
    "llvmlite>=0.44",
    "threadpoolctl>=3.6",
    "indexed-bzip2>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ueba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
